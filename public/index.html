<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MandelFlow</title>
  <meta name="description" content="Transformez une ambition en plan d'action Mandel-art 9x9, guidé par l'IA.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3E%3Cg fill='%23334155'%3E%3Crect x='1' y='1' width='8' height='8' rx='2'/%3E%3Crect x='11' y='1' width='8' height='8' rx='2'/%3E%3Crect x='21' y='1' width='8' height='8' rx='2'/%3E%3Crect x='1' y='11' width='8' height='8' rx='2'/%3E%3Crect x='21' y='11' width='8' height='8' rx='2'/%3E%3Crect x='1' y='21' width='8' height='8' rx='2'/%3E%3Crect x='11' y='21' width='8' height='8' rx='2'/%3E%3Crect x='21' y='21' width='8' height='8' rx='2'/%3E%3C/g%3E%3Crect x='11' y='11' width='8' height='8' rx='2' fill='%23c2410c'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="MandelFlow, accueil">
      <span class="brand-mark" aria-hidden="true"></span> MandelFlow
    </a>
    <ol class="steps" aria-label="Étapes">
      <li data-step="start">Amorce</li>
      <li data-step="levers">Leviers</li>
      <li data-step="actions">Micro-actions</li>
      <li data-step="grid">Matrice</li>
    </ol>
    <div class="topbar-right">
      <span class="mode-badge" id="mode-badge" hidden></span>
      <button class="btn-link" id="restart" hidden>Recommencer</button>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
